services:
  backend:
    build: ./server
    container_name: fastapi_backend
    ports:
      - "5000:5000"
    volumes:
      - ./server/service-account-key.json:/app/service-account-key.json:ro
      - ./server/.env:/app/.env:ro
    restart: always

  frontend:
    build: ./client
    container_name: vite_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
